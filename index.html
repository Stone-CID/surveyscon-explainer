<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
  <meta name="referrer" content="no-referrer">
  <title>Research explainer · Draft preview</title>
  <link rel="stylesheet" href="gate.css">
  <script src="unlock.js" type="module"></script>
</head>
<body>
  <header class="nav">
    <div class="brands" aria-label="Stone Center for Inequality Dynamics and Surveys of Consumers, University of Michigan">
      <img class="stone" src="assets/stone-center.png" alt="Stone Center for Inequality Dynamics">
      <span class="slash" aria-hidden="true">/</span>
      <img class="surveys" src="assets/surveys-of-consumers.png" alt="Surveys of Consumers, University of Michigan">
    </div>
    <span class="preview-label">Draft preview</span>
  </header>
  <main>
    <div class="kicker"><span aria-hidden="true" class="square"></span> Research explainer</div>
    <h1>A closer look at<br><span>household spending.</span></h1>
    <p class="intro">This explainer is a draft for review.<br>Enter the passphrase to take a look.</p>
    <form id="unlock-form" aria-label="Open the draft explainer">
      <label for="passphrase">Passphrase</label>
      <div class="entry-row">
        <div class="password-field">
          <input id="passphrase" name="passphrase" type="password" autocomplete="off" autocapitalize="none" spellcheck="false" required aria-describedby="status">
          <button id="visibility" type="button" aria-label="Show passphrase" aria-pressed="false">Show</button>
        </div>
        <button id="open-button" type="submit">Open explainer <span aria-hidden="true">↗</span></button>
      </div>
      <p id="status" role="status" aria-live="polite"></p>
    </form>
    <noscript><p>JavaScript is required to unlock and display this explainer.</p></noscript>
    <footer><span>Stone Center for Inequality Dynamics</span><span>University of Michigan</span></footer>
  </main>
</body>
</html>
